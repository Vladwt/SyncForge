[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syncforge"
version = "1.0.0"
description = "Intelligent File Synchronization & Backup Manager for Windows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SyncForge Team" }
]
dependencies = [
    "PySide6>=6.6.0",
    "blake3>=0.4.0",
    "watchdog>=3.0.0",
    "pywin32>=306",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "hypothesis>=6.90.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
syncforge = "syncforge.main:main"
syncforge-cli = "syncforge.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
